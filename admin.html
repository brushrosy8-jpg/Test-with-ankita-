<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन डैशबोर्ड - Test with Ankita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">🛠️ Test with Ankita एडमिन पैनल</h1>
            <div class="space-x-3">
                <a href="/" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-sm">वेबसाइट देखें</a>
                <button onclick="adminLogout()" class="px-3 py-1 bg-red-600 hover:bg-red-700 rounded text-sm">लॉग आउट</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow space-y-6">
        <!-- Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-6 rounded-xl shadow border">
                <h3 class="text-gray-500 text-sm font-medium">कुल रजिस्टर्ड छात्र</h3>
                <p id="stat-students" class="text-3xl font-bold text-indigo-600 mt-2">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border">
                <h3 class="text-gray-500 text-sm font-medium">कुल प्रकाशित टेस्ट</h3>
                <p id="stat-tests" class="text-3xl font-bold text-emerald-600 mt-2">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border">
                <h3 class="text-gray-500 text-sm font-medium">कुल सबमिशन</h3>
                <p id="stat-subs" class="text-3xl font-bold text-amber-600 mt-2">0</p>
            </div>
        </div>

        <!-- Upload Mock Test ZIP -->
        <div class="bg-white p-6 rounded-xl shadow border space-y-4">
            <h2 class="text-lg font-bold text-slate-800">📦 मॉक टेस्ट ZIP अपलोड करें (इम्पोर्ट)</h2>
            <form id="upload-zip-form" onsubmit="uploadZipTest(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ZIP फ़ाइल चुनें</label>
                    <input type="file" id="test-zip-file" accept=".zip" required class="w-full text-sm border rounded-lg p-1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">विषय (Subject)</label>
                    <select id="zip-subject" class="w-full px-3 py-2 border rounded-lg">
                        <option value="गणित">गणित (Maths)</option>
                        <option value="रीजनिंग">रीजनिंग (Reasoning)</option>
                        <option value="हिंदी">हिंदी (Hindi)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">अवधि (मिनट)</label>
                    <input type="number" id="zip-duration" value="20" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow">इम्पोर्ट करें</button>
                </div>
            </form>
        </div>

        

<!-- HTML टेस्ट अपलोड -->
<div class="bg-white p-6 rounded-xl shadow border space-y-4">
  <h2 class="text-lg font-bold text-slate-800">📄 HTML टेस्ट अपलोड करें</h2>

  <form id="upload-html-form" onsubmit="uploadHtmlTest(event)" class="space-y-3">
    <div>
      <label class="block text-sm font-medium mb-1">टेस्ट की HTML फ़ाइल</label>
      <input type="file" id="html-test-file" accept=".html,text/html"
        required class="w-full text-sm border rounded-lg p-2">
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">विषय चुनें</label>
      <select id="html-test-subject" required class="w-full px-3 py-2 border rounded-lg">
        <option value="गणित">गणित (Maths)</option>
        <option value="हिंदी">हिंदी (Hindi)</option>
        <option value="रीजनिंग">रीजनिंग (Reasoning)</option>
      </select>
    </div>

    <button id="upload-html-button" type="submit"
      class="py-2.5 px-4 bg-indigo-600 text-white font-semibold rounded-lg">
      HTML टेस्ट अपलोड करें
    </button>
  </form>

  <p id="html-upload-status" class="text-sm"></p>
</div>

        <!-- Create Test Manually -->
        <div class="bg-white p-6 rounded-xl shadow border space-y-4">
            <h2 class="text-lg font-bold text-slate-800">नया टेस्ट मैन्युअल बनाएं</h2>
            <form id="create-test-form" onsubmit="createTest(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">टेस्ट शीर्षक (Title)</label>
                    <input type="text" id="test-title" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">विषय (Subject)</label>
                    <select id="test-subject" class="w-full px-3 py-2 border rounded-lg">
                        <option value="गणित">गणित (Maths)</option>
                        <option value="रीजनिंग">रीजनिंग (Reasoning)</option>
                        <option value="हिंदी">हिंदी (Hindi)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">अवधि (मिनट)</label>
                    <input type="number" id="test-duration" value="20" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow">टेस्ट जोड़ें</button>
                </div>
            </form>
        </div>

        <!-- Tests Management -->
        <div class="bg-white p-6 rounded-xl shadow border space-y-4">
            <h2 class="text-lg font-bold text-slate-800">टेस्ट प्रबंधन एवं प्रश्न जोड़ें</h2>
            <div id="admin-tests-list" class="space-y-4"></div>
        </div>

        <!-- Results Export -->
        <div class="bg-white p-6 rounded-xl shadow border space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800">छात्र परिणाम (Student Results)</h2>
                <a href="/api/admin/results/csv" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold shadow">CSV एक्सपोर्ट करें</a>
            </div>
            <div id="admin-results-list" class="overflow-x-auto"></div>
        </div>
    </main>

    <script>
        
        async function uploadHtmlTest(event) {
            event.preventDefault();

            const input = document.getElementById('html-test-file');
            const status = document.getElementById('html-upload-status');
            const button = document.getElementById('upload-html-button');
            const file = input.files[0];

            if (!file || !file.name.toLowerCase().endsWith('.html')) {
                status.textContent = 'कृपया .html फ़ाइल चुनें।';
                return;
            }

            const formData = new FormData();
            formData.append('htmlTest', file);

            button.disabled = true;
            status.textContent = 'अपलोड हो रहा है...';

            try {
                const response = await fetch('/api/admin/upload-html', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'अपलोड विफल हुआ।');
                }

                status.textContent = 'अपलोड सफल! विद्यार्थी वाले पेज पर जाँचें।';
                input.value = '';
            } catch (error) {
                status.textContent = 'त्रुटि: ' + error.message;
            } finally {
                button.disabled = false;
            }
        }

        async function loadAdminData() {
            try {
                const res = await fetch('/api/admin/data');
                if(!res.ok) { window.location.href = '/admin-login.html'; return; }
                const data = await res.json();
                document.getElementById('stat-students').textContent = data.studentCount;
                document.getElementById('stat-tests').textContent = data.tests.length;
                document.getElementById('stat-subs').textContent = data.results.length;

                // Render Tests
                const testsList = document.getElementById('admin-tests-list');
                testsList.innerHTML = data.tests.map(t => `
                    <div class="p-4 border rounded-xl bg-slate-50 space-y-3">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-gray-800">${t.title} <span class="text-xs px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded ml-2">${t.subject}</span></h3>
                                <p class="text-xs text-gray-500">अवधि: ${t.duration} मिनट | अंक: +${t.marks_correct} / -${t.marks_incorrect} | स्थिति: ${t.published ? 'प्रकाशित (Published)' : 'ड्राफ्ट (Draft)'}</p>
                            </div>
                            <div class="space-x-2">
                                <button onclick="togglePublish(${t.id}, ${t.published})" class="px-3 py-1 bg-${t.published ? 'amber' : 'emerald'}-600 text-white rounded text-xs">${t.published ? 'अनपब्लिश करें' : 'पब्लिश करें'}</button>
                                <button onclick="deleteTest(${t.id})" class="px-3 py-1 bg-red-600 text-white rounded text-xs">डिलीट</button>
                            </div>
                        </div>
                        <!-- Question Form -->
                        <form onsubmit="addQuestion(event, ${t.id})" class="grid grid-cols-1 sm:grid-cols-6 gap-2 pt-2 border-t">
                            <input type="text" placeholder="प्रश्न (Question)" name="question" required class="sm:col-span-2 px-2 py-1 border rounded text-sm">
                            <input type="text" placeholder="विकल्प A" name="optA" required class="px-2 py-1 border rounded text-sm">
                            <input type="text" placeholder="विकल्प B" name="optB" required class="px-2 py-1 border rounded text-sm">
                            <input type="text" placeholder="विकल्प C" name="optC" required class="px-2 py-1 border rounded text-sm">
                            <input type="text" placeholder="विकल्प D" name="optD" required class="px-2 py-1 border rounded text-sm">
                            <select name="correct" class="px-2 py-1 border rounded text-sm">
                                <option value="A">सही: A</option>
                                <option value="B">सही: B</option>
                                <option value="C">सही: C</option>
                                <option value="D">सही: D</option>
                            </select>
                            <input type="text" placeholder="स्पष्टीकरण (Explanation)" name="explanation" class="sm:col-span-4 px-2 py-1 border rounded text-sm">
                            <button type="submit" class="sm:col-span-1 bg-indigo-600 text-white rounded text-sm py-1">प्रश्न जोड़ें</button>
                        </form>
                    </div>
                `).join('') || '<p class="text-gray-500 text-sm">कोई टेस्ट उपलब्ध नहीं है।</p>';

                // Render Results
                const resList = document.getElementById('admin-results-list');
                resList.innerHTML = `
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-gray-100 border-b">
                                <th class="p-2">छात्र नाम</th>
                                <th class="p-2">टेस्ट ID</th>
                                <th class="p-2">स्कोर</th>
                                <th class="p-2">सही / गलत</th>
                                <th class="p-2">दिनांक</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.results.map(r => `
                                <tr class="border-b">
                                    <td class="p-2 font-medium">${r.student_name}</td>
                                    <td class="p-2">${r.test_id}</td>
                                    <td class="p-2 text-indigo-600 font-bold">${r.score}</td>
                                    <td class="p-2">${r.correct_count} / ${r.incorrect_count}</td>
                                    <td class="p-2 text-gray-500">${new Date(r.created_at).toLocaleString()}</td>
                                </tr>
                            `).join('') || '<tr><td colspan="5" class="p-4 text-center text-gray-500">कोई परिणाम उपलब्ध नहीं है।</td></tr>'}
                        </tbody>
                    </table>
                `;
            } catch(e) { console.error(e); }
        }

        async function createTest(e) {
            e.preventDefault();
            const title = document.getElementById('test-title').value;
            const subject = document.getElementById('test-subject').value;
            const duration = document.getElementById('test-duration').value;
            await fetch('/api/admin/tests', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, subject, duration })
            });
            document.getElementById('create-test-form').reset();
            loadAdminData();
        }

        async function uploadZipTest(e) {
            e.preventDefault();
            const fileInput = document.getElementById('test-zip-file');
            const subject = document.getElementById('zip-subject').value;
            const duration = document.getElementById('zip-duration').value;
            
            const formData = new FormData();
            formData.append('testZip', fileInput.files[0]);
            formData.append('subject', subject);
            formData.append('duration', duration);

            try {
                const res = await fetch('/api/admin/upload-zip', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if(res.ok) {
                    alert('टेस्ट ZIP सफलतापूर्वक इम्पोर्ट किया गया!');
                    fileInput.value = '';
                    loadAdminData();
                } else {
                    alert(data.error || 'इम्पोर्ट विफल');
                }
            } catch(err) {
                alert('अपलोड त्रुटि');
            }
        }

        async function togglePublish(id, current) {
            await fetch(`/api/admin/tests/${id}/publish`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ published: !current })
            });
            loadAdminData();
        }

        async function deleteTest(id) {
            if(confirm('क्या आप वाकई इस टेस्ट को डिलीट करना चाहते हैं?')) {
                await fetch(`/api/admin/tests/${id}`, { method: 'DELETE' });
                loadAdminData();
            }
        }

        async function addQuestion(e, testId) {
            e.preventDefault();
            const form = e.target;
            const qData = {
                test_id: testId,
                question: form.question.value,
                option_a: form.optA.value,
                option_b: form.optB.value,
                option_c: form.optC.value,
                option_d: form.optD.value,
                correct_answer: form.correct.value,
                explanation: form.explanation.value
            };
            await fetch('/api/admin/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(qData)
            });
            loadAdminData();
        }

        async function adminLogout() {
            await fetch('/api/admin/logout', { method: 'POST' });
            window.location.href = '/admin-login.html';
        }

        loadAdminData();
    </script>
</body>
</html>
